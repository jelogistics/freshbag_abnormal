<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프레시백 미회수 검수 사진 확인</title>

  <!-- Open Graph (카카오톡/페북 미리보기용) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="프레시백 미회수 검수 사진 확인">
  <meta property="og:description" content="캠프·라우트별 미회수 검수 사진 확인 및 이의제기">
  <meta property="og:url" content="https://jelogistics.github.io/jelogistics/">
  <meta property="og:image" content="https://jelogistics.github.io/jelogistics/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="프레시백 미회수 검수 사진 확인">
  <meta name="twitter:description" content="캠프·라우트별 미회수 검수 사진과 이의제기 현황을 확인할 수 있습니다.">
  <meta name="twitter:image" content="https://jelogistics.github.io/jelogistics/og-image.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    /* ===== 회사 공통 디자인 (다른 시스템과 동일한 값) ===== */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f4f6fb;
      color: #111827;
      -webkit-text-size-adjust: 100%;
    }
    button, input, select, textarea { font-family: inherit; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    label { font-size: 13px; font-weight: 700; color: #374151; }
    input, select {
      width: 100%; min-width: 0; height: 46px;
      border: 1px solid #d1d5db; border-radius: 12px;
      padding: 0 14px; font-size: 16px; background: #ffffff; color: #111827;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    input[type="checkbox"] {
      width: 20px; min-width: 20px; height: 20px; padding: 0;
      border-radius: 4px; flex: none; accent-color: #2563eb;
    }
    textarea {
      width: 100%; padding: 12px 14px;
      border: 1px solid #d1d5db; border-radius: 12px;
      font-size: 16px; line-height: 1.5; resize: vertical;
    }
    button {
      height: 46px; border: 0; border-radius: 12px;
      background: #2563eb; color: white;
      font-size: 15px; font-weight: 800; cursor: pointer;
      padding: 0 18px; white-space: nowrap;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .panel {
      background: #ffffff; border: 1px solid #e5e7eb; border-radius: 18px;
      padding: 22px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
      margin-bottom: 16px;
    }
    .field { display: grid; gap: 8px; }
    .badge {
      display: inline-flex; align-items: center; height: 26px; padding: 0 10px;
      border-radius: 999px; font-size: 12px; font-weight: 900; white-space: nowrap;
    }
    .badge.green { background: #ecfdf5; color: #047857; }
    .badge.gray { background: #f3f4f6; color: #4b5563; }
    .badge.blue { background: #eff6ff; color: #1d4ed8; }
    .badge.black { background: #111827; color: #ffffff; }
    .badge.purple { background: #f3e8ff; color: #7e22ce; }
    .empty-box {
      padding: 32px; border: 1px dashed #cbd5e1; border-radius: 14px;
      background: #f9fafb; text-align: center; color: #6b7280;
    }
    .error-box {
      padding: 12px; border-radius: 12px; background: #fef2f2;
      color: #b91c1c; font-size: 13px; font-weight: 700;
    }
    .site-footer {
      margin-top: 40px; padding-top: 20px; border-top: 1px solid #e5e7eb; text-align: center;
    }
    .site-footer p { margin: 0 0 6px; font-size: 11px; line-height: 1.6; color: #9ca3af; }

    .busy-overlay {
      position: fixed; inset: 0; z-index: 10000;
      display: none; align-items: center; justify-content: center;
      background: rgba(17, 24, 39, 0.55); cursor: progress;
    }
    .busy-overlay.show { display: flex; }
    .busy-card {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      max-width: 320px; padding: 28px 32px; border-radius: 16px;
      background: #ffffff; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .busy-card strong { font-size: 17px; }
    .busy-card span { font-size: 13px; color: #6b7280; }
    .busy-spinner {
      width: 44px; height: 44px; border: 5px solid #dbeafe; border-top-color: #2563eb;
      border-radius: 50%; animation: busy-spin 0.9s linear infinite;
    }
    @keyframes busy-spin { to { transform: rotate(360deg); } }

    .toast-message {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      z-index: 9999; display: none; align-items: center; gap: 12px;
      max-width: min(640px, calc(100vw - 32px)); padding: 12px 16px;
      border-radius: 12px; background: #111827; color: #ffffff;
      font-size: 14px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .toast-message.show { display: flex; }

    /* ===== 이 화면 전용 ===== */
    .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 120px; }
    .hero { text-align: center; margin-bottom: 22px; }
    .hero-logo { width: 100%; max-width: 220px; height: auto; margin-bottom: 20px; }
    .hero p { margin: 0; color: #6b7280; font-size: 15px; }
    .period { margin-top: 12px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

    .search-form {
      display: grid; grid-template-columns: 1fr 1.4fr 1.2fr auto; gap: 12px; align-items: end;
    }
    .search-form button { min-width: 96px; }

    .result-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin: 22px 2px 12px;
    }
    .result-head h2 { margin: 0; font-size: 18px; }
    .result-head .badges { display: flex; gap: 6px; flex-wrap: wrap; }

    .item-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 14px;
    }
    .item-no { font-size: 13px; font-weight: 800; color: #6b7280; }
    .item-date { font-size: 20px; font-weight: 900; margin-top: 2px; }
    .item-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .photo {
      margin: 0; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; background: #f9fafb;
    }
    .photo figcaption {
      padding: 8px 12px; font-size: 13px; font-weight: 800; color: #374151;
      border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;
    }
    .photo figcaption .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .photo img {
      width: 100%; aspect-ratio: 720 / 366; object-fit: cover; display: block;
      cursor: zoom-in; background: #e5e7eb;
    }
    .zoom-hint { font-size: 11px; color: #9ca3af; font-weight: 600; }

    .appeal {
      margin-top: 14px; padding-top: 14px; border-top: 1px dashed #e5e7eb;
    }
    .appeal-check {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 800; cursor: pointer; color: #111827;
      padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 12px; background: #fff;
    }
    .appeal-check:has(input:checked) { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    .appeal-box { display: none; margin-top: 10px; }
    .appeal-box.open { display: block; }
    .appeal-box.missing textarea { border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12); }
    .appeal-box .error-box { display: none; margin-top: 8px; }
    .appeal-box.missing .error-box { display: block; }
    .appeal-done {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: 12px;
      background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857;
      font-size: 14px; font-weight: 800;
    }
    .panel.is-done { background: #fcfefd; }

    .submit-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: none; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: #ffffff; border-top: 1px solid #e5e7eb;
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.08);
    }
    .submit-bar.show { display: block; }
    .submit-inner {
      max-width: 820px; margin: 0 auto;
      display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 10px; align-items: center;
    }
    .submit-count { font-size: 14px; font-weight: 800; white-space: nowrap; }
    .submit-count strong { color: #2563eb; font-size: 18px; }

    .lightbox {
      position: fixed; inset: 0; z-index: 2000; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(15, 23, 42, 0.85);
    }
    .lightbox.show { display: flex; }
    .lightbox img { max-width: 100%; max-height: 82vh; border-radius: 12px; background: #fff; }
    .lightbox-inner { display: grid; gap: 12px; justify-items: center; }
    .lightbox-cap { color: #fff; font-weight: 800; font-size: 15px; }
    .lightbox button { background: rgba(255, 255, 255, 0.18); }

    @media (max-width: 700px) {
      h1 { font-size: 22px; }
      .panel { padding: 16px; border-radius: 16px; }
      .search-form { grid-template-columns: 1fr 1fr; }
      .search-form .field-camp { grid-column: 1 / -1; order: -1; }
      .search-form button { grid-column: 1 / -1; }
      .photos { gap: 8px; }
      .photo figcaption { padding: 6px 8px; font-size: 12px; }
      .zoom-hint { display: none; }
      .submit-inner { grid-template-columns: 1fr 1fr; }
      .submit-count { grid-column: 1 / -1; }
      .submit-inner button { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <img src="logo.png?v=2"alt="(주)준은로지스틱스" class="hero-logo">
    <h1>프레시백 미회수 검수 사진 확인</h1>
    <p>본인 라우트의 검수 사진을 확인하고 바로 이의제기할 수 있습니다.</p>
    <div class="period" id="periodInfo"></div>
  </header>

  <section class="panel">
    <form class="search-form" id="searchForm" onsubmit="search(); return false;">
      <div class="field">
        <label for="workType">업무형태</label>
        <select id="workType">
          <option value="">선택</option>
          <option value="주간">주간</option>
          <option value="야간">야간</option>
        </select>
      </div>
      <div class="field field-camp">
        <label for="camp">캠프</label>
        <select id="camp">
          <option value="">캠프 선택</option>
        </select>
      </div>
      <div class="field">
        <label for="route">라우트</label>
        <input type="text" id="route" placeholder="예: 813D" autocomplete="off" autocapitalize="characters">
      </div>
      <button type="submit" id="searchBtn">검색</button>
    </form>
  </section>

  <div id="result"></div>

  <footer class="site-footer">
    <p>미회수 검수 사진의 적용 기간은 전월 26일부터 당월 25일까지입니다.</p>
    <p>이의제기는 건별로 한 번만 접수할 수 있습니다.</p>
    <p>© (주)준은로지스틱스</p>
  </footer>
</div>

<div class="submit-bar" id="submitBar">
  <div class="submit-inner">
    <div class="submit-count">선택 <strong id="checkedCount">0</strong>건</div>
    <input type="text" id="name" placeholder="성함">
    <input type="text" id="workId" placeholder="업무 ID">
    <button id="submitBtn" onclick="submitAppeals()">이의제기 제출</button>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-inner">
    <div class="lightbox-cap" id="lightboxCap"></div>
    <img id="lightboxImg" alt="">
    <button type="button">닫기</button>
  </div>
</div>

<div class="busy-overlay" id="busy">
  <div class="busy-card">
    <div class="busy-spinner"></div>
    <strong>이의제기 전송 중</strong>
    <span>잠시만 기다려주세요. 창을 닫지 마세요.</span>
  </div>
</div>

<div class="toast-message" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyIHLB9Zzr5l-EX4_oFZiiTenmhpvOzrE5us4EQVXMfHKiKITDlMy3AKyjytatdh9WrbA/exec";

const CAMPS = ["강서1캠프","광주1캠프","광주2캠프","구로1캠프","구리1캠프","구리2캠프","구리3캠프","구미1캠프",
  "군포1캠프","김포1캠프","김해1캠프","김해2캠프","남양주1캠프","남양주2캠프","남양주3캠프","남양주4캠프",
  "대구1캠프","대구2캠프","대구3캠프","대구4캠프","대구5캠프","대전1캠프","대전2캠프","대전3캠프",
  "동탄1캠프","동탄2캠프","부산1캠프","부산2캠프","부산3캠프","부산4캠프","부산5캠프","서초1캠프",
  "성동1캠프","송파1캠프","송파2캠프","송파3캠프","송파4캠프","송파5캠프","수원1캠프","시흥1캠프",
  "시흥2캠프","안산1캠프","안산2캠프","안양1캠프","양주1캠프","양주2캠프","양주3캠프","용인1캠프",
  "용인2캠프","용인3캠프","울산1캠프","울산2캠프","인천1캠프","인천2캠프","인천3캠프","인천4캠프",
  "인천5캠프","인천6캠프","인천7캠프","인천8캠프","일산1캠프","일산2캠프","일산3캠프","일산4캠프",
  "일산5캠프","일산6캠프","일산7캠프","일산8캠프","전주1캠프","제주1캠프","제주2캠프","제주3캠프",
  "중구1캠프","창원1캠프","천안1캠프","청주1캠프","화성1캠프","M_안성1캠프","F_장안1캠프"];

let data = [];
let appealed = new Set();   // "기간|번호" 형태 (예: "2026-11|3")
let searchResults = [];

const keyOf = item => `${item.batch}|${item.UNQ_no}`;
const norm = s => String(s || "").replace(/\s+/g, "").toUpperCase();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- 데이터 로드
const dataReady = fetch("data_updated.json?v=" + Date.now(), { cache: "no-store" })
  .then(res => res.json())
  .then(json => {
    data = Array.isArray(json) ? json : [];
    fillCamps();
    showPeriod();
  })
  .catch(err => {
    console.error("데이터 불러오기 실패:", err);
    $("result").innerHTML = '<div class="error-box">데이터를 불러오지 못했습니다. 잠시 후 새로고침 해주세요.</div>';
  });

function fillCamps() {
  const all = [...CAMPS];
  data.forEach(d => { if (d.camp && !all.includes(d.camp)) all.push(d.camp); });
  const sel = $("camp");
  all.forEach(c => sel.add(new Option(c, c)));
}

// 정산 기간: 전월 26일 ~ 당월 25일 (batch "2026-11" = 2026.10.26 ~ 2026.11.25)
function showPeriod() {
  if (!data.length) return;
  const [y, m] = String(data[0].batch || "").split("-").map(Number);
  if (!y || !m) return;
  const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  $("periodInfo").innerHTML =
    `<span class="badge blue">${y}년 ${m}월분</span>` +
    `<span class="badge gray">${py}.${pm}.26 ~ ${y}.${m}.25</span>`;
}

function loadAppealed() {
  return fetch(API_URL + "?t=" + Date.now())
    .then(res => res.json())
    .then(json => { (json.appealed || []).forEach(k => appealed.add(String(k))); })
    .catch(err => console.error("이의제기 목록 불러오기 실패:", err));
}

// ---------------------------------------------------------------- 검색
async function search() {
  const workType = $("workType").value;
  const camp = $("camp").value;
  const route = norm($("route").value);

  if (!workType || !camp || !route) {
    toast("업무형태, 캠프, 라우트를 모두 입력해주세요.");
    return;
  }

  const btn = $("searchBtn");
  btn.disabled = true; btn.textContent = "검색 중...";
  await Promise.all([dataReady, loadAppealed()]);
  btn.disabled = false; btn.textContent = "검색";

  searchResults = data.filter(item =>
    item.workType === workType && item.camp === camp && norm(item.route) === route
  );
  render();
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

function render() {
  const box = $("result");
  updateSubmitBar();

  if (searchResults.length === 0) {
    box.innerHTML = `
      <div class="result-head"><h2>검색 결과</h2></div>
      <div class="empty-box">해당 라우트의 미회수 검수 건이 없습니다.<br>
        <span style="font-size:13px">업무형태·캠프·라우트를 다시 확인해주세요.</span></div>`;
    return;
  }

  const doneCount = searchResults.filter(i => appealed.has(keyOf(i))).length;
  let html = `
    <div class="result-head">
      <h2>검색 결과 ${searchResults.length}건</h2>
      <div class="badges">
        ${doneCount ? `<span class="badge green">이의제기 완료 ${doneCount}</span>` : ""}
        <span class="badge gray">미접수 ${searchResults.length - doneCount}</span>
      </div>
    </div>`;

  searchResults.forEach((item, i) => {
    const done = appealed.has(keyOf(item));
    html += `
      <article class="panel ${done ? "is-done" : ""}">
        <div class="item-head">
          <div>
            <div class="item-no">No. ${esc(item.UNQ_no)}</div>
            <div class="item-date">${esc(item.date)}</div>
            <div class="item-tags">
              <span class="badge ${item.workType === "야간" ? "purple" : "blue"}">${esc(item.workType)}</span>
              <span class="badge gray">${esc(item.camp)}</span>
              <span class="badge black">${esc(item.route)}</span>
            </div>
          </div>
          ${done ? '<span class="badge green">접수 완료</span>' : ""}
        </div>

        <div class="photos">
          <figure class="photo">
            <figcaption><span><span class="dot" style="background:#dc2626"></span>미회수 사진</span><span class="zoom-hint">눌러서 크게 보기</span></figcaption>
            <img src="${esc(item.photoMissing)}" alt="미회수 사진" loading="lazy"
                 onclick="openLightbox(this.src, '미회수 사진 · No. ${esc(item.UNQ_no)}')">
          </figure>
          <figure class="photo">
            <figcaption><span><span class="dot" style="background:#2563eb"></span>배송완료 사진</span><span class="zoom-hint">눌러서 크게 보기</span></figcaption>
            <img src="${esc(item.photoDelivered)}" alt="배송완료 사진" loading="lazy"
                 onclick="openLightbox(this.src, '배송완료 사진 · No. ${esc(item.UNQ_no)}')">
          </figure>
        </div>

        <div class="appeal">
          ${done
            ? '<div class="appeal-done">📩 이의제기 접수가 완료된 건입니다.</div>'
            : `<label class="appeal-check">
                 <input type="checkbox" id="appealCheck${i}" onchange="toggleAppeal(${i})">
                 📌 이의제기
               </label>
               <div class="appeal-box" id="appealBox${i}">
                 <textarea id="appealText${i}" rows="3" placeholder="이의제기 사유를 입력하세요." oninput="this.parentNode.classList.remove('missing')"></textarea>
                 <div class="error-box">이의제기 사유를 입력해주세요.</div>
               </div>`}
        </div>
      </article>`;
  });
  box.innerHTML = html;
}

// ---------------------------------------------------------------- 이의제기
function checkedIndexes() {
  return searchResults.map((_, i) => i).filter(i => {
    const cb = $(`appealCheck${i}`);
    return cb && cb.checked;
  });
}

function toggleAppeal(i) {
  const open = $(`appealCheck${i}`).checked;
  $(`appealBox${i}`).classList.toggle("open", open);
  if (open) $(`appealText${i}`).focus();
  updateSubmitBar();
}

function updateSubmitBar() {
  const n = checkedIndexes().length;
  $("checkedCount").textContent = n;
  $("submitBar").classList.toggle("show", n > 0);
}

async function submitAppeals() {
  const name = $("name").value.trim();
  const workId = $("workId").value.trim();
  const idx = checkedIndexes();
  if (!idx.length) return;

  // 사유가 빈 칸인 건이 하나라도 있으면 전체 제출 중단
  let firstMissing = null;
  idx.forEach(i => {
    const box = $(`appealBox${i}`);
    const empty = !$(`appealText${i}`).value.trim();
    box.classList.toggle("missing", empty);
    if (empty && !firstMissing) firstMissing = box;
  });
  if (firstMissing) {
    toast("이의제기 사유를 입력하지 않은 건이 있습니다.");
    firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (!name || !workId) {
    toast("성함과 업무 ID를 입력해주세요.");
    (!name ? $("name") : $("workId")).focus();
    return;
  }

  const entries = idx.map(i => {
    const item = searchResults[i];
    return {
      UNQ_no: item.UNQ_no,
      batch: item.batch,
      date: item.date,
      workType: item.workType,
      camp: item.camp,
      route: item.route,
      reason: $(`appealText${i}`).value.trim()
    };
  });

  $("busy").classList.add("show");
  $("submitBtn").disabled = true;
  try {
    // text/plain 으로 보내면 Apps Script 응답을 읽을 수 있음 (성공 여부 확인 가능)
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name, workId, entries })
    });
    const json = await res.json();
    if (json.status !== "success") throw new Error(json.message || "unknown");

    entries.forEach(e => appealed.add(`${e.batch}|${e.UNQ_no}`));
    $("name").value = "";
    $("workId").value = "";
    render();
    toast(`✅ 이의제기 ${entries.length}건이 접수되었습니다.`);
  } catch (err) {
    console.error(err);
    toast("전송에 실패했습니다. 잠시 후 다시 시도해주세요.");
  } finally {
    $("busy").classList.remove("show");
    $("submitBtn").disabled = false;
  }
}

// ---------------------------------------------------------------- 공통 UI
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function openLightbox(src, cap) {
  $("lightboxImg").src = src;
  $("lightboxCap").textContent = cap;
  $("lightbox").classList.add("show");
}
function closeLightbox() { $("lightbox").classList.remove("show"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
</script>
</body>
</html>
